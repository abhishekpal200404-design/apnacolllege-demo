<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Demo Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #demo-text {
            font-weight: bold;
            color: #28a745;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to the Demo!</h1>
        <p>This is a simple HTML template showcasing text structure, custom layout styling, and basic JavaScript actions.</p>
        
        <!-- Interactive Elements -->
        <button onclick="changeText()">Click Me</button>
        <p id="demo-text"></p>
    </div>

    <script>
        function changeText() {
            document.getElementById('demo-text').innerText = "🎉 Success! The JavaScript action triggered perfectly.";
        }
    </script>

</body>
</html>
